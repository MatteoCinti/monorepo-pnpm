version: '3.9'
name: monorepo_dev
services:
  web-app:
    init: true
    image: img_monorepo-web-app_dev
    container_name: ctr_web-app_dev
    build:
      context: ../../
      dockerfile: ./docker/build/Dockerfile.client.dev
    volumes:
      - type: bind
        source: ../../@app/client
        target: /var/www/@app/client
      - type: volume
        target: /var/www/@app/client/node_modules
      - type: bind
        source: ../../@app/client/vite.config.ts
        target: /var/www/@app/client/vite.config.ts
    environment:
      - NETWORK_ENV=docker
    ports:
      - 8080:8080
    networks:
      - frontend

  api:
    image: img_morepo-api_dev
    container_name: ctr_api_dev
    build:
      context: ../../
      dockerfile: ./docker/build/Dockerfile.server.dev
    volumes:
      - type: bind
        source: ../../@app/server
        target: /var/www/@app/server
      - type: volume
        target: /var/www/@app/server/node_modules
    links:
      - mongo
    ports:
      - 4000:4000
    networks:
      - frontend
      - backend

  mongo:
    image: mongo:4.4.29
    container_name: ctr_mongo_dev
    command: mongod --auth --logpath=/dev/null # --quiet
    env_file: '../../@app/server/.env'
    ports:
      - '27019:27017'
    restart: 'unless-stopped'
    volumes:
      - db_data:/data/db
      - ../../@app/server/src/providers/mongo/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - backend
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_NON_ROOT_USERNAME: ${MONGO_DB_USERNAME}
      MONGO_NON_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE_NAME}

networks:
  frontend:
    name: net_morepo-frontend_dev
  backend:
    name: net_monorepo-backend_dev

volumes:
  db_data:
